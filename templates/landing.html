<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valen.ai | Autonomous Core</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0f172a;
            --accent-glow: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3.5rem;
            color: var(--accent-glow);
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }
        p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        a.btn {
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }
        a.btn:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }
        a.btn-outline {
            background-color: transparent;
            border: 1px solid var(--accent-glow);
            color: var(--accent-glow);
        }
        a.btn-outline:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

    <h1>VALEN.AI ECOSYSTEM</h1>
    <p>Autonomous Intelligence, Sub-Bot Fleet Matrix, and Cryptographic Security Vault operational with zero-error architecture.</p>
    
    <div class="btn-group">
        <a href="/login" class="btn">Access Terminal</a>
        <a href="/dashboard" class="btn btn-outline">Supreme Dashboard</a>
    </div>

</body>
</html>
