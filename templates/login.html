<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valen.ai | Secure Login</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0f172a;
            --accent-glow: #38bdf8;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            color: var(--accent-glow);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #060913;
            border: 1px solid #1e293b;
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            border-color: var(--accent-glow);
            outline: none;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .error-msg {
            color: var(--accent-danger);
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>VALEN.AI ACCESS</h1>
        <p>Authenticate with Supreme Master Key</p>
        
        <div class="form-group">
            <label>Master Security Key</label>
            <input type="password" id="master-key-input" placeholder="Enter master key...">
        </div>
        
        <button onclick="authenticateAdmin()">Initialize Session</button>
        <div id="error-alert" class="error-msg">Access Denied: Invalid Master Key.</div>
    </div>

    <script>
        function authenticateAdmin() {
            let key = document.getElementById('master-key-input').value;
            let errorAlert = document.getElementById('error-alert');

            // Hardcoded check for supreme key or validate via vault API
            if(key === "VALEN_SUPREME_SECURE_KEY") {
                localStorage.setItem("valen_auth", "authenticated");
                window.location.href = "/dashboard";
            } else {
                errorAlert.style.display = "block";
            }
        }
    </script>
</body>
</html>
