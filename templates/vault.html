<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valen.ai | Security Vault</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0f172a;
            --accent-glow: #38bdf8;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 1.8rem;
            color: var(--accent-danger);
            letter-spacing: 2px;
            margin: 0;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--accent-glow);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .card h3 {
            margin-top: 0;
            color: var(--accent-glow);
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #060913;
            border: 1px solid #1e293b;
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: var(--accent-glow);
            outline: none;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .btn-danger {
            background-color: var(--accent-danger);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <header>
        <h1>CRYPTOGRAPHIC SECURITY VAULT</h1>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/bots">Bot Matrix</a>
            <a href="/vault" style="color: var(--accent-danger);">Security Vault</a>
            <a href="/login">Logout</a>
        </div>
    </header>

    <div class="grid-container">
        <!-- Store Secret Card -->
        <div class="card">
            <h3>Store Encrypted Secret</h3>
            <div class="form-group">
                <label>Key Identifier (e.g., OPENAI_API_KEY)</label>
                <input type="text" id="key-id" placeholder="Enter key name...">
            </div>
            <div class="form-group">
                <label>Encrypted Secret Payload</label>
                <input type="password" id="secret-val" placeholder="Enter secret value...">
            </div>
            <div class="form-group">
                <label>Master Security Key</label>
                <input type="password" id="master-key" placeholder="Enter master key...">
            </div>
            <button onclick="storeSecret()">Commit to Vault</button>
        </div>

        <!-- Panic Shredder Card -->
        <div class="card" style="border-color: #7f1d1d;">
            <h3 style="color: var(--accent-danger);">Panic Shredder Matrix</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Permanently shred specific credentials or execute emergency local wipe.</p>
            <div class="form-group" style="margin-top: 20px;">
                <label>Target Key Identifier to Shred</label>
                <input type="text" id="shred-key" placeholder="Key name to destroy...">
            </div>
            <div class="form-group">
                <label>Master Security Key</label>
                <input type="password" id="shred-master-key" placeholder="Enter master key...">
            </div>
            <button class="btn-danger" onclick="shredKey()">Execute Panic Shred</button>
        </div>
    </div>

    <script>
        async function storeSecret() {
            let keyId = document.getElementById('key-id').value;
            let secretVal = document.getElementById('secret-val').value;
            let masterKey = document.getElementById('master-key').value;

            if(!keyId || !secretVal || !masterKey) {
                alert("All fields are required.");
                return;
            }

            try {
                let res = await fetch('/api/v1/vault/store', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-master-key': masterKey
                    },
                    body: JSON.stringify({
                        key_identifier: keyId,
                        encrypted_secret: secretVal,
                        access_level: 1
                    })
                });
                let data = await res.json();
                alert(data.message || "Credential stored securely.");
                document.getElementById('key-id').value = '';
                document.getElementById('secret-val').value = '';
            } catch (err) {
                alert("Failed to store secret in vault.");
            }
        }

        async function shredKey() {
            let shredKeyId = document.getElementById('shred-key').value;
            let masterKey = document.getElementById('shred-master-key').value;

            if(!shredKeyId || !masterKey) {
                alert("Key identifier and Master Key are required.");
                return;
            }

            if(confirm(`CRITICAL WARNING: Permanently shred '${shredKeyId}' from vault?`)) {
                try {
                    let res = await fetch(`/api/v1/vault/shred/${shredKeyId}`, {
                        method: 'DELETE',
                        headers: {
                            'x-master-key': masterKey
                        }
                    });
                    let data = await res.json();
                    alert(data.message || "Shred command executed.");
                    document.getElementById('shred-key').value = '';
                } catch (err) {
                    alert("Panic shred request failed.");
                }
            }
        }
    </script>
</body>
</html>
